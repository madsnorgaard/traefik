services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.toml:/traefik.toml:ro
      - ./traefik_dynamic.toml:/traefik_dynamic.toml:ro
      - ./acme.json:/acme.json
      - ./logs:/log
    networks:
      - web

networks:
  web:
    external: true
