services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
      # Port 8080 intentionally NOT published — dashboard only accessible from VPS2 localhost
      # To access dashboard: ssh -L 8080:localhost:8080 webadmin@VPS2 -p 22022
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.toml:/traefik.toml:ro
      - ./traefik_dynamic.toml:/traefik_dynamic.toml:ro
      - ./acme.json:/acme.json
      - ./logs:/log
    networks:
      - web

networks:
  web:
    external: true
