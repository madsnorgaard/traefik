# Dashboard authentication
# Generate a hashed password with: htpasswd -nb username password
# Or online: https://www.htpasswd.ca/
[http.middlewares.simpleAuth.basicAuth]
  users = [
    "admin:$apr1$your_hashed_password_here"
  ]

# Traefik dashboard router
# Replace monitor.yourdomain.com with your actual monitoring domain
[http.routers.api]
  rule = "Host(`monitor.yourdomain.com`)"
  entrypoints = ["websecure"]
  middlewares = ["simpleAuth"]
  service = "api@internal"
  [http.routers.api.tls]
    certResolver = "lets-encrypt"

# Bitwarden — static route (Docker provider not picking up container)
[http.routers.bitwarden]
  rule = "Host(`bitwarden.theazanianprepper.online`)"
  service = "bitwarden"
  [http.routers.bitwarden.tls]
    certResolver = "lets-encrypt"

[http.services.bitwarden.loadbalancer]
  [[http.services.bitwarden.loadbalancer.servers]]
    url = "http://bitwarden-bitwarden-1:80/"

# TLS configuration
[tls.options]

  [tls.options.default]
    minVersion = "VersionTLS12"
    sniStrict = true

  [tls.options.mintls13]
    minVersion = "VersionTLS13"
